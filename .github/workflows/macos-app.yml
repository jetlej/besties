# Builds the Besties Mac app on Blacksmith's Apple Silicon runners.
#
#   PRs + pushes to main → unsigned Release build (compile check, no secrets).
#   Tag v1.3 / manual run → ./release.sh: Developer ID signed, notarized,
#                           stapled Besties.zip uploaded as a short-lived artifact.
#
# The appcast + site deploy stay on the release Mac (EdDSA key lives in its
# login Keychain) — see CLAUDE.md "Releasing a new app version".

name: macOS app

on:
  pull_request:
    paths: [Besties/**, release.sh, .github/workflows/macos-app.yml]
  push:
    branches: [main]
    paths: [Besties/**, release.sh, .github/workflows/macos-app.yml]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to sign + notarize, major.minor[.patch] (e.g. 1.3)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (unsigned)
    # Public repo: fork PRs would burn macOS minutes on Blacksmith — same-repo only.
    if: >-
      github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build Release
        working-directory: Besties
        run: |
          xcodebuild -project Besties.xcodeproj -scheme Besties -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  release:
    name: Sign + notarize
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 60
    # Put the secrets on this environment and restrict it to main + v* tags.
    environment: release
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          # The p12 usually holds only the leaf + key; codesign needs the
          # Developer ID G2 intermediate to build the chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -f pkcs12 -A -t cert -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # word-split on purpose: one arg per existing keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"

          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q "Developer ID Application: Jordan Lejuwaan (34HCA7L7PV)" \
            || { echo "::error::Developer ID Application identity for 34HCA7L7PV not found in the p12"; exit 1; }

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          SKIP_APPCAST: '1'
        run: ./release.sh "${VERSION#v}"

      # Public repo: artifacts are downloadable by any signed-in GitHub user,
      # and this is the paid app — keep retention minimal.
      - uses: actions/upload-artifact@v4
        with:
          name: Besties-${{ env.VERSION }}
          path: Besties.zip
          retention-days: 3
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc_api_key.p8" "$RUNNER_TEMP/devid.p12"
