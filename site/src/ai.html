<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP_NAME__ AI</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<script>window.bt={q:[],track:function(e,p){window.bt.q.push([e,p])}}</script>
<script defer src="/t.js"></script>
<style>
  :root {
    --paper: #FDF8EE; --ink: #211E1A; --muted: #6E675E; --line: #EBE3D4;
    --card: #FFFFFF; --blue: #0A7CFF; --sun: #FFC53D;
    --pop: 6px 6px 0 color-mix(in srgb, var(--ink) 12%, transparent);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    background-image: radial-gradient(color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1.4px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .display { font-family: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: -0.02em; }
  .card {
    background: var(--card); border: 2px solid var(--ink); border-radius: 22px;
    box-shadow: var(--pop); max-width: 480px; width: 100%;
    padding: 44px 36px; text-align: center;
    animation: rise .6s cubic-bezier(.3,1.25,.4,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
  .pill { width: 84px; height: 84px; display: inline-block; animation: bob 3s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-4px) rotate(-6deg); } to { transform: translateY(4px) rotate(6deg); } }
  h1 { font-size: 2rem; font-weight: 800; margin: 14px 0 10px; }
  .hl {
    background: linear-gradient(var(--sun), var(--sun)) left bottom / 100% .16em no-repeat;
    padding-bottom: .08em;
  }
  p { color: var(--muted); margin-bottom: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
    background: var(--blue); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 1.05rem; padding: 14px 32px; border-radius: 999px;
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
    transition: transform .13s ease, box-shadow .13s ease;
  }
  .btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
  .btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .plans { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .plans .btn { margin-top: 0; justify-content: center; }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .note { font-size: .9rem; margin-top: 16px; }
  .steps { text-align: left; margin: 26px auto 0; max-width: 340px; font-size: .95rem; color: var(--muted); }
  .steps li { margin-bottom: 6px; }
  footer { margin-top: 26px; font-size: .85rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .card, .pill { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <img class="pill" src="/icon.png" alt="" width="84" height="84">
    <h1 class="display">__APP_NAME__ <span class="hl">AI</span></h1>
    <p>Nothing to set up. Claude, GPT and more, with <b>3,000 AI credits every month</b>.</p>
    <div class="plans">
      <a class="btn" href="/api/subscribe?plan=yearly" data-t="checkout_start" data-t-plan="yearly">Yearly — __AI_PRICE_YEARLY__ (2 months free)</a>
      <a class="btn ghost" href="/api/subscribe?plan=monthly" data-t="checkout_start" data-t-plan="monthly">Monthly — __AI_PRICE_MONTHLY__</a>
    </div>
    <p class="note">Cancel anytime. Already subscribed? Open the AI tab in __APP_NAME__ and sign in with your email.</p>
  </div>
</body>
</html>
